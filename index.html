<script>
'use strict';
/* ===================================================================
   NIPPON KOMBAT — Phase 1 engine
   320x224-class internal render, integer-scaled. Two players, one
   phone, one shared camera. Sprites come from an atlas + frame table,
   so swapping in digitised sprites means swapping two files.
   =================================================================== */
const A = JSON.parse(document.getElementById('assets').textContent);
const GH = 224;
let   VW = 320;                       // visible columns (varies with the screen)

const cv = document.getElementById('c'), ctx = cv.getContext('2d', {alpha:false});
ctx.imageSmoothingEnabled = false;
const buf = document.createElement('canvas'), bx = buf.getContext('2d');
bx.imageSmoothingEnabled = false;

let SC = 3, OX = 0, OY = 0, DW = 0, DH = 0, HS = 3, HW = 320;

/* ---------------------------------------------------------------- assets */
function img(src){ const i = new Image(); i.src = src; return i; }
const ATLAS = img(A.atlas), PORT = img(A.port);
const STAGES = A.stages;
let loaded = 0, needed = 2 + STAGES.length * 2;
[ATLAS, PORT].forEach(i => i.onload = () => loaded++);

STAGES.forEach(s => {
  s.im = img(s.plate); s.mk = img(s.mask);
  s.im.onload = () => { loaded++; prepStage(s); };
  s.mk.onload = () => { loaded++; prepStage(s); };
  if (s.props) s.props.forEach(pr => { pr.im = img(pr.img); pr.travel = Math.abs(pr.x1-pr.x0)/Math.abs(pr.spd); });
});

function prepStage(s){
  if (!s.im.complete || !s.mk.complete || s.ready) return;
  s.cv = document.createElement('canvas'); s.cv.width = s.w; s.cv.height = GH;
  s.cx = s.cv.getContext('2d', {willReadFrequently:true});
  s.cx.imageSmoothingEnabled = false;
  s.cx.drawImage(s.im, 0, 0);
  s.base = s.cx.getImageData(0, 0, s.w, GH);
  s.work = new ImageData(new Uint8ClampedArray(s.base.data), s.w, GH);

  const mc = document.createElement('canvas'); mc.width = s.w; mc.height = GH;
  const mx = mc.getContext('2d', {willReadFrequently:true});
  mx.drawImage(s.mk, 0, 0);
  const md = mx.getImageData(0, 0, s.w, GH).data;

  const ramp = s.ramp, N = ramp.length;
  s.px = []; s.rank = []; s.off = [];
  for (let y = 0; y < GH; y++) for (let x = 0; x < s.w; x++){
    const i = (y * s.w + x);
    if (md[i * 4] < 128) continue;
    const r = s.base.data[i*4], g = s.base.data[i*4+1], b = s.base.data[i*4+2];
    let best = 0, bd = 1e9;
    for (let k = 0; k < N; k++){
      const d = (r-ramp[k][0])**2 + (g-ramp[k][1])**2 + (b-ramp[k][2])**2;
      if (d < bd){ bd = d; best = k; }
    }
    s.px.push(i); s.rank.push(best);
    s.off.push(s.mode === 'fall' ? (y / 3 | 0) : ((x / 7 | 0) + (y / 11 | 0)));
  }
  s.ready = true;
}

function cycleStage(s, phase){
  if (!s.ready) return;
  const d = s.work.data, ramp = s.ramp, N = ramp.length;
  for (let k = 0; k < s.px.length; k++){
    const i = s.px[k] * 4, c = ramp[(s.rank[k] + phase + s.off[k]) % N];
    d[i] = c[0]; d[i+1] = c[1]; d[i+2] = c[2];
  }
  s.cx.putImageData(s.work, 0, 0);
}

/* ---------------------------------------------------------------- layout */
function fit(){
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  DW = Math.round(innerWidth * dpr); DH = Math.round(innerHeight * dpr);
  cv.width = DW; cv.height = DH; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.imageSmoothingEnabled = false;
  SC = DH / GH;                                  // fill the height; pixels stay hard (no smoothing)
  const maxW = st.stage ? st.stage.w : 480;
  VW = Math.min(maxW, Math.max(320, Math.ceil(DW / SC)));
  buf.width = VW; buf.height = GH; bx.imageSmoothingEnabled = false;
  OX = ((DW - VW * SC) / 2) | 0; OY = ((DH - GH * SC) / 2) | 0;
  HS = Math.max(1, Math.floor(DH / GH));         // HUD stays on whole pixels
  HW = Math.floor(DW / HS);
}
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 250));

/* ---------------------------------------------------------------- audio */
const AU = (() => {
  let ctxA = null, master = null, playing = false, cur = null, step = 0, nxt = 0, timer = null;
  const NT = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const hz = n => { const m = /^([A-G]#?)(-?\d)$/.exec(n); return m ? 440 * Math.pow(2, (NT[m[1]] + (+m[2]-4)*12 - 9)/12) : 0; };
  let sq = null, nb = null;
  function init(){
    if (ctxA) return;
    const AC = window.AudioContext || window.webkitAudioContext; ctxA = new AC();
    master = ctxA.createGain(); master.gain.value = .3;
    const cp = ctxA.createDynamicsCompressor(); cp.threshold.value = -14; cp.ratio.value = 6;
    master.connect(cp); cp.connect(ctxA.destination);
    const re = new Float32Array(24), imv = new Float32Array(24);
    for (let i = 1; i < 24; i++) imv[i] = (2/(i*Math.PI))*Math.sin(i*Math.PI*0.5);
    sq = ctxA.createPeriodicWave(re, imv, {disableNormalization:false});

/* touch layout, in device pixels, per player */
function pads(){
  const m = Math.max(DW * .035, 22), bh = DH;
  const zw = DW * .30;
  return [0,1].map(p => {
    const base = p === 0 ? m : DW - m;
    const s = p === 0 ? 1 : -1;
    const dcx = base + s * (zw * .21), dcy = bh * .62, dr = Math.min(zw*.26, bh*.24);
    const br = dr * .40, gx = base + s * (zw * .64), gy = bh * .55, sp = br * 2.35;
    return { dcx, dcy, dr, br,
      HP:[gx, gy - sp*.5], HK:[gx + s*sp, gy - sp*.5],
      LP:[gx, gy + sp*.5], LK:[gx + s*sp, gy + sp*.5],
      BLx: dcx, BLy: dcy + dr + br*1.5, BLw: dr*1.5, BLh: br*1.3 };
  });
}
let PAD = null;
const TIN = [ {}, {} ];        // per-player touch state
function readTouch(list){
  const st2 = [{},{}];
  PAD = pads();
  for (const t of list){
    const x = t.clientX * (DW/innerWidth), y = t.clientY * (DH/innerHeight);
    const p = x < DW/2 ? 0 : 1, P = PAD[p], S = st2[p];
    const dx = x - P.dcx, dy = y - P.dcy;
    if (dx*dx + dy*dy < P.dr*P.dr*1.45){
      const ax = Math.abs(dx), ay = Math.abs(dy);
      if (ax > P.dr*.26 && ax >= ay*.7) S[dx < 0 ? 'L' : 'R'] = 1;
      if (ay > P.dr*.26 && ay >= ax*.7) S[dy < 0 ? 'U' : 'D'] = 1;
      continue;
    }
    if (Math.abs(x - P.BLx) < P.BLw && Math.abs(y - P.BLy) < P.BLh*1.6){ S.BL = 1; continue; }
    for (const b of ['HP','HK','LP','LK']){
      const q = P[b], qx = x - q[0], qy = y - q[1];
      if (qx*qx + qy*qy < P.br*P.br*2.0){ S[b] = 1; break; }
    }
  }
  for (let p = 0; p < 2; p++) for (const k in st2[p]) if (!TIN[p][k]) TPULSE[p][k] = 1;
  TIN[0] = st2[0]; TIN[1] = st2[1];
}

['touchstart','touchmove','touchend','touchcancel'].forEach(ev =>

function tickFighter(f, o, p){
  const stg = st.stage;
  if (st.hitstop > 0) return;

  if (f.stun > 0) f.stun--;
  if (f.state === 'ko'){
    f.y = Math.max(0, f.y + f.vy); f.vy -= .55; if (f.y <= 0){ f.y = 0; f.vy = 0; f.an = 'down'; }
    return;
  }

  const fighting = st.phase === 2;
  const canAct = fighting && f.stun <= 0 && !f.mv;

  // facing
  if (!f.mv && !f.air && f.stun <= 0){ const nf = o.x > f.x ? 1 : -1; if (nf !== f.face && Math.abs(o.x-f.x) > 6) f.face = nf; }

  const d = dirOf(f, p), up = held(p,'U'), dn = held(p,'D'), bl = held(p,'BL');
  feedDir(f, dn ? 'd' : (d || ''));

  f.block = 0; f.crouch = 0;

  if (canAct){
    // attacks fire on the press edge; block wins over a mashed button, like the arcade
    const LP = down(p,'LP'), HP = down(p,'HP'), LK = down(p,'LK'), HK = down(p,'HK');
    if (!f.air){
      if (bl){ f.block = 1; f.crouch = dn ? 1 : 0; f.an = dn ? 'cblock' : 'block'; f.af = 0; }
      else if (HP || LP || HK || LK){
        let m = null;
        if (dn && HP) m = 'upper';
        else if (dn && LK) m = 'sweep';
        else if (HK && bufHas(f,['b','d','b'])) m = 'sig';
        else if (LP && bufHas(f,['b','b']))     m = 'proj';
        else m = HP ? 'hp' : LP ? 'lp' : HK ? 'hk' : 'lk';
        start(f, m);
      }
      else if (up){ f.vy = 8.4; f.air = 1; f.an = 'jumpup'; AU.sfx('jump'); f.vx = d === 'f' ? 2.0*f.face : d === 'b' ? -1.6*f.face : 0; }
      else if (dn){ f.crouch = 1; f.an = 'crouch'; f.af = 0; }
      else if (d){ f.an = d === 'f' ? 'walkf' : 'walkb'; f.x += (d === 'f' ? 1.6 : -1.1) * f.face; }
      else { f.an = 'idle'; }
    } else if (!f.mv){
      if (HP || LP) start(f, 'alp');
      else if (HK || LK) start(f, 'alk');
    }
  } else if (f.stun > 0 && !f.air && f.state !== 'ko'){
    // hit / blockstun anim held
  }

  // move progression
  if (f.mv){
    const m = MV[f.mv]; f.mvT++;
    const total = m.su + m.ac + m.rc;
    if (m.lunge && f.mvT <= m.su + m.ac && !f.air) f.x += m.lunge * f.face;
    f.an = m.an;
    f.af = f.mvT <= m.su ? 0 : f.mvT <= m.su + m.ac ? 1 : 2;
    const fr = A.frames[f.key + ':' + m.an];
    if (f.af >= fr.length) f.af = fr.length - 1;
    if (f.mvT === m.su + 1 && m.fire){
      st.proj.push({x: f.x + 16*f.face, y: 62, vx: f.c.proj.spd*f.face, own: p, c: f.c.proj, life:160});
      AU.sfx('fire');
    }
    if (f.mvT >= total){ f.mv = null; f.mvT = 0; f.hasHit = 0; f.an = 'idle'; }
  }

  // physics
  if (f.air){
    f.y += f.vy; f.vy -= .55; f.x += f.vx;
    if (!f.mv) f.an = f.vy > 0 ? 'jumpup' : 'jumpdn';
    if (f.y <= 0){ f.y = 0; f.vy = 0; f.air = 0; f.vx = 0; f.juggle = 0; f.an = 'idle'; AU.sfx('land');
      if (f.mv && MV[f.mv].air){ f.mv = null; f.mvT = 0; f.hasHit = 0; } }
  } else if (f.vx){ f.x += f.vx; f.vx *= .82; if (Math.abs(f.vx) < .12) f.vx = 0; }

  f.x = Math.max(24, Math.min(stg.w - 24, f.x));
}

function start(f, name){
  const m = MV[name];
  f.mv = name; f.mvT = 0; f.hasHit = 0; f.an = m.an; f.af = 0; f.buf.length = 0;
}

function resolveHits(a, b, ia){
  if (!a.mv || a.hasHit) return;
  const m = MV[a.mv]; if (!m.box) return;
  if (a.mvT <= m.su || a.mvT > m.su + m.ac) return;
  const hb = box(a, m.box, m.air), db = hurt(b);
  if (!overlap([hb[0], hb[1], hb[2], hb[3]], db)) return;
  a.hasHit = 1;

  const facing = (b.face > 0 ? a.x > b.x : a.x < b.x);
  const blocked = b.block && facing && ((m.hit === 'low') === !!b.crouch);
  if (blocked){
    AU.sfx('block'); b.stun = 9; b.vx = 1.6 * -b.face; st.hitstop = 3;
    fxAdd(b.x + 10*b.face, b.y + 55, 3, '#DBDBDB', 2);
    return;
  }
  let dmg = m.dmg;
  if (b.air || b.y > 0){ b.juggle++; dmg = Math.round(dmg * (b.juggle === 1 ? 1 : b.juggle === 2 ? .7 : .4)); }
  b.hp = Math.max(0, b.hp - dmg);
  st.hitstop = m.snd === 'heavy' ? 7 : 4; st.flash = 3; st.shake = m.snd === 'heavy' ? 5 : 2;
  AU.sfx(m.snd);
  fxAdd(b.x + 8*b.face, b.y + (m.hit === 'low' ? 26 : 66), m.snd === 'heavy' ? 9 : 5, '#DB0000', 3.2);
  b.an = m.hit === 'low' ? 'chit' : 'hit'; b.af = 0; b.stun = m.snd === 'heavy' ? 18 : 12;
  b.mv = null; b.mvT = 0; b.block = 0;
  b.vx = (m.push || 2) * -b.face;
  if (m.launch){ b.air = 1; b.vy = m.launch; b.stun = 30; }
  if (m.knock){ b.air = 1; b.vy = 4.2; b.vx = 3.2 * -b.face; b.stun = 34; b.an = 'fall'; }
  if (b.hp <= 0) koFighter(b, ia);
}

function koFighter(b, byIdx){
  if (b.state === 'ko') return;
  st.wins[byIdx]++;
  b.state = 'ko'; b.an = 'fall'; b.air = 1; b.vy = 5.2; b.vx = 3.0 * -b.face; b.stun = 999;
  st.winner = byIdx; st.phase = 3; st.phaseT = 0;
  AU.stop(); AU.sfx('ko');
  st.bloodMarks.push({x:b.x, n:6 + (Math.random()*5|0)});
}

/* ---------------------------------------------------------------- draw */
function drawF(g, f){
  const key = f.key + ':' + (f.gim || f.an);
  const fr = A.frames[key] || A.frames[f.key + ':idle'];
  let i;
  if (!f.gim && (f.an === 'idle' || f.an === 'walkf' || f.an === 'walkb')) i = fr[((st.t/7)|0) % fr.length];
  else i = fr[Math.min(f.gim ? 0 : f.af, fr.length-1)];
  const sx = (i % A.cols) * A.fw, sy = ((i / A.cols)|0) * A.fh;
  const dx = Math.round(f.x - 32 - st.cam), dy = Math.round(st.stage.floor - f.y - 111);
  g.save();
  if (f.face < 0){ g.translate(dx + A.fw, dy); g.scale(-1, 1); g.drawImage(ATLAS, sx, sy, A.fw, A.fh, 0, 0, A.fw, A.fh); }
  else g.drawImage(ATLAS, sx, sy, A.fw, A.fh, dx, dy, A.fw, A.fh);
  g.restore();
}
function shadow(g, f){
  const x = Math.round(f.x - st.cam), y = st.stage.floor - 2;
  const w = 16 - Math.min(8, f.y/12);
  g.fillStyle = 'rgba(0,0,0,.42)';
  g.beginPath(); g.ellipse(x, y, w, 2.4, 0, 0, 6.3); g.fill();
}

function hud(g){
  const F = st.f, VW = HW;
  txt(g, 6, 4, 'WINS: 0' + st.wins[0], '#24DBDB');
  const w2 = 'WINS: 0' + st.wins[1]; txt(g, VW - 6 - tw(w2), 4, w2, '#FFB600');
  shad(g, VW/2, 2, String(st.timer < 10 ? '0'+st.timer : st.timer), '#FFB600', 2, '#492400');
  for (let s = 0; s < 2; s++){
    const f = F[s], nm = f.c.name;
    const x0 = s === 0 ? 6 : VW - 78;
    g.fillStyle = '#120024'; g.fillRect(x0, 15, 72, 14);
    g.strokeStyle = '#DB0000'; g.lineWidth = 1; g.strokeRect(x0+.5, 15.5, 71, 13);
    ctxt(g, x0 + 36, 19, nm.length > 12 ? nm.slice(0,12) : nm, '#DBDBDB');
    const bw = Math.max(70, Math.round(VW/2 - 82 - 18));
    const bx0 = s === 0 ? 82 : VW - 82 - bw;
    g.fillStyle = '#240000'; g.fillRect(bx0, 15, bw, 10);
    g.strokeStyle = '#FFFFFF'; g.strokeRect(bx0+.5, 15.5, bw-1, 9);
    const fw = Math.max(0, Math.round((bw-2) * f.hp / 100));
    const fx0 = s === 0 ? bx0+1 : bx0 + bw - 1 - fw;
    g.fillStyle = '#2449DB'; g.fillRect(fx0, 16, fw, 8);
    g.fillStyle = '#6D92FF'; g.fillRect(fx0, 16, fw, 3);
    g.fillStyle = '#180000'; g.fillRect(bx0, 27, bw, 5);
    for (let i = 0; i < fw; i++){
      let t = i / Math.max(1, fw-1); if (s === 1) t = 1 - t;
      g.fillStyle = 'rgb(' + Math.round(36+219*Math.min(1,t*2)) + ',' + Math.round(219*(1-Math.max(0,t*2-1))) + ',' + Math.round(73*(1-t)) + ')';
      g.fillRect(fx0+i, 28, 1, 3);
    }
  }
}

    const rem = Math.max(0, Math.ceil((300 - st.phaseT) / 60));
    ctxt(g, VW/2, 186, '0' + rem, '#FFB600', 2);

function drawGore(g){
  if (!st.gore) return;
  for (const p of st.gore.props){
    const fr = A.frames[p.key]; if (!fr) continue;
    const i = fr[0], sx = (i % A.cols) * A.fw, sy = ((i / A.cols)|0) * A.fh;
    const pv = p.pv || 56;
    const dx = Math.round(p.x - 32 - st.cam), dy = Math.round(st.stage.floor - p.y - pv);
    g.save();
    g.translate(dx + 32, dy + pv);
    if (p.rot) g.rotate(p.rot * Math.PI / 180);
    if (p.face < 0) g.scale(-1, 1);
    g.drawImage(ATLAS, sx, sy, A.fw, A.fh, -32, -pv, A.fw, A.fh);
    g.restore();
  }
}
/* ---------------------------------------------------------------- screens */
function drawProps(g, s){
  if (!s.props) return;
  for (const pr of s.props){
    if (!pr.im || !pr.im.complete) continue;
    const cyc = pr.travel + pr.gap;
    let t = ((st.t - pr.phase) % cyc + cyc) % cyc;
    if (t > pr.travel) continue;
    g.drawImage(pr.im, Math.round(pr.x0 + t*pr.spd - st.cam), pr.y);
  }
}
function drawFight(g){
  const stg = st.stage;
  g.drawImage(stg.cv, Math.round(st.cam), 0, VW, GH, 0, 0, VW, GH);
  drawProps(g, stg);
  // blood on the floor
  g.fillStyle = '#920000';
  for (const b of st.bloodMarks) for (let i = 0; i < b.n; i++){
    const x = Math.round(b.x - st.cam + (i*7 % 23) - 11);
    g.fillRect(x, stg.floor + 1 + (i % 3)*2, 2, 2);
  }
  for (const f of st.f) shadow(g, f);
  for (const p of st.proj){
    g.fillStyle = p.c.col; g.fillRect(Math.round(p.x - st.cam), Math.round(stg.floor - p.y), p.c.w, p.c.h);
    g.fillStyle = '#FFFFFF'; g.fillRect(Math.round(p.x - st.cam), Math.round(stg.floor - p.y), 2, 1);
  }
  const order = st.f[0].y > st.f[1].y ? [1,0] : [0,1];
  for (const i of order) if (!st.f[i].hide) drawF(g, st.f[i]);
  drawGore(g);
  for (const p of st.fx){
    g.fillStyle = p.col; g.fillRect(Math.round(p.x - st.cam), Math.round(stg.floor - p.y), 2, 2);
  }
  if (st.flash > 0){ g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(0, 0, VW, GH); }
  if (st.phase === 4){ g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(0, 0, VW, GH); }
}

/* ---------------------------------------------------------------- controls overlay */
function drawPads(){
  if (st.scr !== 'fight' && st.scr !== 'select' && st.scr !== 'stage' && st.scr !== 'result') return;
  const P = pads() ; PAD = P;
  const a = st.padA;
  if (a <= 0.02) return;
  ctx.save(); ctx.globalAlpha = a; ctx.lineWidth = Math.max(2, DW*.0035);
  for (let p = 0; p < 2; p++){
    const q = P[p], col = p === 0 ? '#24DBDB' : '#FFB600';
    ctx.strokeStyle = col;
    ctx.beginPath(); ctx.arc(q.dcx, q.dcy, q.dr, 0, 6.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(q.dcx-q.dr*.5,q.dcy); ctx.lineTo(q.dcx+q.dr*.5,q.dcy);
    ctx.moveTo(q.dcx,q.dcy-q.dr*.5); ctx.lineTo(q.dcx,q.dcy+q.dr*.5); ctx.stroke();
    ctx.strokeRect(q.BLx-q.BLw, q.BLy-q.BLh, q.BLw*2, q.BLh*2);
    ctx.font = Math.round(q.br*.62)+'px ui-monospace,monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle = col; ctx.fillText('BLOCK', q.BLx, q.BLy);
    for (const b of ['HP','HK','LP','LK']){
      const c = q[b]; ctx.strokeStyle = (b[1]==='P') ? '#FF2424' : col;
      ctx.beginPath(); ctx.arc(c[0], c[1], q.br, 0, 6.3); ctx.stroke();
      ctx.fillStyle = ctx.strokeStyle; ctx.fillText(b, c[0], c[1]);
    }
  }
  ctx.restore();
}

/* ---------------------------------------------------------------- input edges */
const KL = ['L','R','U','D','LP','HP','LK','HK','BL'];
let curI = [{},{}], lastI = [{},{}];
function sampleInput(){
  lastI = curI; curI = [{},{}];
  for (let p = 0; p < 2; p++) for (const k of KL) curI[p][k] = (held(p,k) || pulsed(p,k)) ? 1 : 0;
  clearPulse();
}
const down = (p,k) => curI[p][k] && !lastI[p][k];
const punch = p => down(p,'LP') || down(p,'HP');
const anyBtn = p => punch(p) || down(p,'LK') || down(p,'HK');
function anyPress(){ return anyBtn(0) || anyBtn(1) || anyTap; }

/* ---------------------------------------------------------------- match */
function newMatch(){
  st.rnd = 1; st.bloodMarks = []; startRound();
}
function startRound(){
  st.f = [mkFighter(st.chars[0], 0), mkFighter(st.chars[1], 1)];
  const w = st.stage.w;
  st.f[0].x = w/2 - 46; st.f[1].x = w/2 + 46;
  st.f[0].face = 1; st.f[1].face = -1;
  st.phase = 0; st.phaseT = 0; st.timer = 99; st.tickAcc = 0;
  st.proj = []; st.fx = []; st.winner = -1; st.fatal = 0; st.hint = 0; st.gore = null;
  st.vh = GH; st.vy2 = Math.max(0, st.stage.floor + 26 - GH);
  st.msg = st.stage.name; st.msg2 = '';
  st.cam = Math.max(0, Math.min(w - VW, w/2 - VW/2));
}
function endRound(loserIdx){
  if (st.winner >= 0) return;
  koFighter(st.f[loserIdx], 1 - loserIdx);
}

function updateFight(){
  const stg = st.stage, F = st.f;
  st.phaseT++;
  if (st.hitstop > 0) st.hitstop--;
  if (st.flash > 0) st.flash--;
  if (st.shake > 0) st.shake--;

  if (st.phase === 0){
    if (st.phaseT > 96){ st.phase = 1; st.phaseT = 0; st.msg = 'FIGHT!'; AU.sfx('bell'); AU.play(stg.id); }
  } else if (st.phase === 1){
    if (st.phaseT > 46){ st.phase = 2; st.phaseT = 0; st.msg = ''; }
  } else if (st.phase === 2){
    if (st.hitstop <= 0){
      st.tickAcc++;
      if (st.tickAcc >= 42){ st.tickAcc = 0; st.timer--; if (st.timer <= 0){ st.timer = 0; endRound(F[0].hp >= F[1].hp ? 1 : 0); } }
    }
  } else if (st.phase === 3){
    if (st.phaseT === 1){ st.msg = 'K.O.'; }
    if (st.phaseT > 110){
      if (st.wins[st.winner] >= 1){ st.phase = 4; st.phaseT = 0; st.msg = 'FINISH'; st.msg2 = st.chars[1-st.winner] === 'lucy' ? 'HER' : 'HIM'; }
      else { st.rnd++; startRound(); }
    }
  } else if (st.phase === 4){
    const w = st.winner;
    if (st.phaseT > 20 && (down(w,'HP') || down(w,'LP') || down(w,'HK') || down(w,'LK'))){ doFatality(); }
    else if (st.phaseT > 300){ st.phase = 6; st.phaseT = 0; st.msg = ''; st.msg2 = ''; F[w].an = 'win'; }
  } else if (st.phase === 5){
    fatalTick(st.phaseT, F[st.winner], F[1-st.winner]);
    if (st.phaseT > 320){ st.phase = 6; st.phaseT = 0; F[st.winner].an = 'win'; }
  } else if (st.phase === 6){
    F[st.winner].an = 'win'; F[st.winner].af = (st.t/16|0) % 2;
    if (st.gore) goreDrip();
    if (st.phaseT > 70){ st.scr = 'result'; st.t = 0; AU.play('select'); }
  }

  // fighters
  if (st.phase >= 2 && st.phase <= 3){
    tickFighter(F[0], F[1], 0); tickFighter(F[1], F[0], 1);
    resolveHits(F[0], F[1], 0); resolveHits(F[1], F[0], 1);
  } else if (st.phase === 4){
    for (const f of F){ if (f.state !== 'ko'){ f.an = 'idle'; } else { f.y = Math.max(0,f.y+f.vy); f.vy -= .55; if (f.y<=0){f.y=0;f.an='down';} } }
    const l = F[1-st.winner]; l.an = 'down';
  }
  // separation
  const d = F[1].x - F[0].x;
  if (Math.abs(d) < 26 && st.phase === 2){
    const p = (26 - Math.abs(d)) / 2 * (d >= 0 ? 1 : -1);
    F[0].x -= p; F[1].x += p;
    F[0].x = Math.max(24, Math.min(stg.w-24, F[0].x)); F[1].x = Math.max(24, Math.min(stg.w-24, F[1].x));
  }
  // projectiles
  for (let i = st.proj.length-1; i >= 0; i--){
    const p = st.proj[i]; p.x += p.vx; p.life--;
    const tgt = F[1-p.own];
    if (overlap([p.x, p.y-4, p.c.w, p.c.h+6], hurt(tgt)) && tgt.state !== 'ko'){
      const blocked = tgt.block && !tgt.crouch;
      if (blocked){ AU.sfx('block'); tgt.stun = 8; }
      else {
        tgt.hp = Math.max(0, tgt.hp - p.c.dmg); tgt.an = 'hit'; tgt.stun = 14; tgt.mv = null;
        tgt.vx = 2.2*-tgt.face; AU.sfx('hit'); st.flash = 2;
        fxAdd(tgt.x, 64, 5, '#DB0000', 3);
        if (tgt.hp <= 0) koFighter(tgt, p.own);
      }
      st.proj.splice(i,1); continue;
    }
    if (p.life <= 0 || p.x < -20 || p.x > stg.w+20) st.proj.splice(i,1);
  }
  // particles
  for (let i = st.fx.length-1; i >= 0; i--){
    const p = st.fx[i]; p.x += p.vx; p.y += p.vy; p.vy -= .28; p.life--;
    if (p.y <= 0){ p.y = 0; p.vy = 0; p.vx *= .5; }
    if (p.life <= 0) st.fx.splice(i,1);
  }
  // ---- camera: pan, push in when they close, follow them up ----
  const mid = (F[0].x + F[1].x) / 2;
  const want = Math.max(0, Math.min(stg.w - VW, mid - VW/2));
  st.cam += (want - st.cam) * .12;
  const sep = Math.abs(F[0].x - F[1].x);
  const hi  = Math.max(F[0].y, F[1].y);
  let vh = 150 + sep * 0.45;                       // close in tight, back off as they part
  vh = Math.max(vh, hi + 128);                     // never lose a jumper off the top
  vh = Math.max(168, Math.min(GH, vh));
  st.vh += (vh - st.vh) * .07;
  // anchor to the floor, not the bottom of the plate, then rise with a jumper
  const lift = Math.min(24, hi * .35);
  const want2 = Math.max(0, Math.min(GH - st.vh, stg.floor + 26 - st.vh - lift));
  st.vy2 += (want2 - st.vy2) * .10;
}

function doFatality(){
  st.phase = 5; st.phaseT = 0; st.fatal = 1; st.msg = ''; st.msg2 = '';
  st.gore = { props: [], mode: st.chars[st.winner], stump: 0, rain: 0 };
}
function blood(x, y, n, spd){
  for (let i = 0; i < n; i++) st.fx.push({x: x+(Math.random()-.5)*8, y: y+(Math.random()-.5)*6,
    vx:(Math.random()-.5)*(spd||4), vy: Math.random()*4+1, life: 40+Math.random()*40,
    col: Math.random() < .78 ? '#DB0000' : '#920000'});
}
function goreDrip(){
  const G = st.gore;
  if (G.head && st.t % 6 === 0){
    st.fx.push({x: G.head.x+(Math.random()-.5)*4, y: G.head.y-8, vx: 0, vy: -.2, life: 30, col: '#DB0000'});
  }
}
function fatalTick(t, W, L){
  const G = st.gore, face = W.face;
  // walk in
  if (t < 24){
    const want = L.x - 27*face;
    W.x += (want - W.x) * .2; W.an = 'walkf'; W.af = (t/6|0)%2;
    L.an = 'hit'; L.af = 0;
    return;
  }
  if (G.mode === 'lucy'){
    if (t === 25){ W.an = 'hp'; W.af = 0; AU.sfx('squelch'); }
    if (t === 40){
      AU.sfx('rip'); st.shake = 26; st.flash = 3;
      L.gim = 'fx_headless';
      G.head = { key: L.key + ':fx_head', x: W.x + 10*face, y: 80, pv: 20, face: face, held: 1 };
      G.props.push(G.head);
      G.stump = 130; blood(L.x, 88, 46, 7);
      st.bloodMarks.push({x: L.x, n: 14});
    }
    if (t > 40 && t < 90){ W.an = 'upper'; W.af = 2; G.head.x = W.x + 8*face; G.head.y = Math.min(118, G.head.y + 3); }
    if (t === 90){ st.msg = 'FATALITY'; AU.sfx('fatal'); }
    if (t === 110){
      L.hide = 1; L.gim = null;
      G.body = { key: L.key + ':fx_headless', x: L.x, y: 0, pv: 110, face: L.face, rot: 0 };
      G.props.push(G.body);
    }
    if (G.body && G.body.rot > -84){ G.body.rot -= 6; if (G.body.rot <= -84){ G.body.rot = -84; AU.sfx('thud'); st.shake = 8; st.bloodMarks.push({x: L.x - 20*face, n: 18}); blood(L.x - 16*face, 10, 20, 5); } }
    if (t > 110){ W.an = 'win'; W.af = (t/16|0)%2; if (G.head){ G.head.x = W.x + 8*face; G.head.y = 118 + Math.sin(t/9)*2; G.head.x = W.x + 11*face; } }
  } else {
    if (t === 25){ W.an = 'hp'; W.af = 0; L.an = 'chit'; L.af = 0; AU.sfx('squelch'); }
    if (t >= 40 && t < 62 && (t % 7 === 0)){ AU.sfx('squelch'); st.shake = 4; }
    if (t === 62){
      AU.sfx('rip'); st.shake = 32; st.flash = 4;
      L.hide = 1;
      G.torso = { key: L.key + ':fx_torso', x: L.x, y: 46, pv: 56, face: L.face, rot: 0, vx: 3.4*face, vy: 8.8, vr: 13*face, air: 1 };
      G.legs  = { key: L.key + ':fx_legs',  x: L.x, y: 0,  pv: 110, face: L.face, rot: 0 };
      G.props.push(G.torso, G.legs);
      G.rain = 90; blood(L.x, 60, 70, 8);
      st.bloodMarks.push({x: L.x, n: 20});
    }
    if (G.torso && G.torso.air){
      G.torso.x += G.torso.vx; G.torso.y += G.torso.vy; G.torso.vy -= .42; G.torso.rot += G.torso.vr;
      if (G.torso.y <= 12){ G.torso.y = 12; G.torso.air = 0; G.torso.rot = 90*face; AU.sfx('thud'); st.shake = 10;
        st.bloodMarks.push({x: G.torso.x, n: 22}); blood(G.torso.x, 8, 24, 5); }
    }
    if (G.legs && t > 74 && Math.abs(G.legs.rot) < 82){ G.legs.rot -= 5.5*face; if (Math.abs(G.legs.rot) >= 82){ AU.sfx('thud'); st.bloodMarks.push({x: G.legs.x - 14*face, n: 12}); } }
    if (t === 100){ st.msg = 'FATALITY'; AU.sfx('fatal'); }
    if (t > 100){ W.an = 'win'; W.af = (t/16|0)%2; }
  }
  // stump geyser / blood rain
  if (G.stump > 0){ G.stump--; blood(L.x + 2*face, 92, 3, 3); st.fx.push({x: L.x, y: 92, vx: (Math.random()-.5)*2, vy: 5+Math.random()*2, life: 34, col: '#FF2424'}); }
  if (G.rain > 0){ G.rain--; blood(L.x + (Math.random()-.5)*40, 70 + Math.random()*40, 4, 6); }
}

/* ---------------------------------------------------------------- loop */
function update(){
  st.t++;
  sampleInput();
  const active = KL.some(k => curI[0][k] || curI[1][k]) || anyTap;
  st.padA = active ? 1 : Math.max(.10, (st.padA||1) - .012);

  if (st.scr === 'boot'){
    if (st.t > 96 || anyPress()){ st.scr = 'title'; st.t = 0; anyTap = false; }
  }
  else if (st.scr === 'title'){
    if (held(0,'BL') || held(1,'BL')){ AU.unlock(); st.scr = 'moves'; st.t = 0; anyTap = false; }
    else if (anyPress()){ AU.unlock(); AU.sfx('coin'); AU.play('select'); st.scr = 'select'; st.t = 0; anyTap = false;
      st.selCur = [0, Math.min(1, ROSTER.length-1)]; st.selLock = [0,0]; }
  }
  else if (st.scr === 'moves'){
    if (st.t > 30 && (punch(0) || punch(1))){ st.scr = 'title'; st.t = 0; anyTap = false; }
    anyTap = false;
  }
  else if (st.scr === 'select'){
    for (let p = 0; p < 2; p++){
      if (st.selLock[p]) continue;
      if (down(p,'L')){ st.selCur[p] = Math.max(0, st.selCur[p]-1); AU.sfx('blip'); }
      if (down(p,'R')){ st.selCur[p] = Math.min(3, st.selCur[p]+1); AU.sfx('blip'); }
      if (punch(p) && st.selCur[p] < ROSTER.length){ st.selLock[p] = 1; AU.sfx('conf'); }
    }
    if (st.selLock[0] && st.selLock[1]){
      st.chars = [ROSTER[st.selCur[0]], ROSTER[st.selCur[1]]];
      st.wins = [0,0];
      st.scr = 'stage'; st.t = 0; st.stgLock = 0;
    }
    anyTap = false;
  }
  else if (st.scr === 'stage'){
    for (let p = 0; p < 2; p++){
      if (down(p,'L')){ st.stgCur = Math.max(0, st.stgCur-1); AU.sfx('blip'); }
      if (down(p,'R')){ st.stgCur = Math.min(STAGES.length-1, st.stgCur+1); AU.sfx('blip'); }
      if (punch(p)){ st.stgLock = 1; AU.sfx('conf'); }
      if (held(p,'BL') && st.t > 20 && !st.stgLock){ st.stgCur = (Math.random()*STAGES.length)|0; st.stgLock = 1; AU.sfx('conf'); }
    }
    if (st.stgLock){
      st.stage = STAGES[Math.min(st.stgCur, STAGES.length-1)];
      fit(); newMatch(); st.scr = 'vs'; st.t = 0; AU.stop();
    }
    anyTap = false;
  }
  else if (st.scr === 'vs'){
    if (st.t > 140 || anyPress()){ st.scr = 'fight'; st.t = 0; anyTap = false; }
  }
  else if (st.scr === 'fight'){ updateFight(); }
  else if (st.scr === 'result'){
    if (st.t > 40 && anyPress()){
      anyTap = false;
      if (held(0,'BL') || held(1,'BL')){ st.scr = 'select'; st.selLock = [0,0]; st.t = 0; }
      else {
        st.stgCur = (st.stgCur + 1) % STAGES.length;
        st.stage = STAGES[st.stgCur];
        fit(); newMatch(); st.scr = 'vs'; st.t = 0; AU.stop();
      }
    }
  }

  // stage palette cycling
  if (st.stage && st.stage.ready){
    st.cycT++;
    if (st.cycT >= 7){ st.cycT = 0; st.cyc++; if (st.phase !== 4 && st.phase !== 5) cycleStage(st.stage, st.cyc); }
  }
}

function render(){
  const g = bx;
  g.fillStyle = '#000'; g.fillRect(0, 0, VW, GH);
  g.save();
  if (st.shake > 0 && st.scr === 'fight'){
    g.translate((Math.random()-.5)*Math.min(6,st.shake), (Math.random()-.5)*Math.min(4,st.shake));
  }
  if (st.scr === 'boot') drawBoot(g);
  else if (st.scr === 'title') drawTitle(g);
  else if (st.scr === 'moves') drawMoves(g);
  else if (st.scr === 'select') drawSelect(g);
  else if (st.scr === 'stage') drawStageSel(g);
  else if (st.scr === 'vs') drawVS(g);
  else if (st.scr === 'fight') drawFight(g);
  else if (st.scr === 'result') drawResult(g);
  g.restore();

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, DW, DH);
  const live = (st.scr === 'fight' || st.scr === 'result') && st.f;
  if (live){
    const zh = st.vh, zw = Math.min(VW, zh * (DW/DH));
    const midB = (st.f[0].x + st.f[1].x)/2 - st.cam;
    const zx = Math.max(0, Math.min(VW - zw, midB - zw/2));
    const zy = Math.max(0, Math.min(GH - zh, st.vy2));
    ctx.drawImage(buf, zx, zy, zw, zh, 0, 0, DW, DH);
  } else {
    ctx.drawImage(buf, 0, 0, VW, GH, OX, OY, Math.round(VW*SC), Math.round(GH*SC));
  }
  if (live){
    ctx.save(); ctx.setTransform(HS, 0, 0, HS, 0, 0);
    hud(ctx); bigmsg(ctx);
    if (st.scr === 'result') resultHud(ctx);
    ctx.restore();
  }
  drawPads();
}

let acc = 0, last = 0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let dt = ts - last; last = ts;
  if (dt > 120) dt = 120;
  acc += dt;
  let n = 0;
  while (acc >= 16.667 && n < 4){ update(); acc -= 16.667; n++; }
  render();
}

/* silent fullscreen attempt on a real touch, only from the title screen.
   Where the host allows it we go fullscreen; where it doesn't, nothing happens. */
let fsTried = false;
function tryFS(){
  try{
    if (fsTried) return;
    if (typeof st === 'undefined' || st.scr !== 'title') return;
    if (document.fullscreenElement || document.webkitFullscreenElement) return;
    const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
    fsTried = true;
    if (!fn) return;
    Promise.resolve(fn.call(el)).then(() => {
      try { screen.orientation.lock('landscape').catch(()=>{}); } catch(e){}
      setTimeout(fit,150); setTimeout(fit,500);
    }).catch(()=>{});
  } catch(e){ fsTried = true; }
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    if (!(document.fullscreenElement || document.webkitFullscreenElement)) fsTried = false;
    setTimeout(fit,120); setTimeout(fit,450);
  }));

function meta(n,c){ const m=document.createElement('meta'); m.name=n; m.content=c;
  const old=document.querySelector('meta[name="'+n+'"]'); if(old) old.remove(); document.head.appendChild(m); }
meta('viewport','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');
meta('apple-mobile-web-app-capable','yes');
meta('mobile-web-app-capable','yes');
meta('apple-mobile-web-app-status-bar-style','black');
meta('apple-mobile-web-app-title','Nippon Kombat');

function boot(){
  if (loaded < needed){ setTimeout(boot, 60); return; }
  st.stage = STAGES[0];
  fit();
  requestAnimationFrame(frame);
}
boot();

</script>
